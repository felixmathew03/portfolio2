
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiZuosa | Full Stack Developer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #f8fafc;
            overflow-x: hidden;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: #262626;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #404040;
        }

        /* Continuous Animations */
        @keyframes marquee {
          0% { transform: translateX(0%); }
          100% { transform: translateX(-50%); }
        }

        .animate-marquee {
          display: flex;
          width: max-content;
          animation: marquee 50s linear infinite;
        }

        .animate-marquee:hover {
          animation-play-state: paused;
        }

        /* Float Animation */
        @keyframes float {
          0% { transform: translateY(0px) rotate(0deg); }
          50% { transform: translateY(-20px) rotate(2deg); }
          100% { transform: translateY(0px) rotate(0deg); }
        }
        .animate-float {
          animation: float 6s ease-in-out infinite;
        }

        /* Typing Effect */
        @keyframes typing {
          from { width: 0 }
          to { width: 100% }
        }
        @keyframes blink {
          50% { border-color: transparent }
        }
        .typing-effect {
          display: inline-block;
          overflow: hidden;
          white-space: nowrap;
          border-right: 3px solid #6366f1;
          animation: typing 3s steps(40, end), blink .75s step-end infinite;
        }

        /* 3D and Perspective Utilities */
        .perspective-1000 {
          perspective: 1000px;
        }
        .preserve-3d {
          transform-style: preserve-3d;
        }
        .card-3d {
          transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.6s ease;
        }
        .card-3d:hover {
          transform: rotateX(10deg) rotateY(-5deg) translateZ(30px);
          box-shadow: 0 25px 50px -12px rgba(99, 102, 241, 0.25);
        }

        /* Reveal on Scroll */
        .reveal {
          opacity: 0;
          transform: translateY(50px);
          transition: all 1s cubic-bezier(0.2, 1, 0.3, 1);
        }
        .reveal.active {
          opacity: 1;
          transform: translateY(0);
        }

        /* Staggered Children Reveal */
        .stagger-container.active > * {
          opacity: 0;
          animation: slideUp 0.8s cubic-bezier(0.2, 1, 0.3, 1) forwards;
        }
        @keyframes slideUp {
          from { opacity: 0; transform: translateY(30px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .stagger-container.active > *:nth-child(1) { animation-delay: 0.1s; }
        .stagger-container.active > *:nth-child(2) { animation-delay: 0.2s; }
        .stagger-container.active > *:nth-child(3) { animation-delay: 0.3s; }
        .stagger-container.active > *:nth-child(4) { animation-delay: 0.4s; }
        .stagger-container.active > *:nth-child(5) { animation-delay: 0.5s; }

        /* Background */
        .mesh-gradient {
          background-color: #050505;
          background-image: 
            radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
            radial-gradient(at 50% 0%, hsla(225,39%,30%,0.2) 0, transparent 50%), 
            radial-gradient(at 100% 0%, hsla(339,49%,30%,0.2) 0, transparent 50%), 
            radial-gradient(at 0% 100%, hsla(339,49%,30%,0.2) 0, transparent 50%), 
            radial-gradient(at 50% 100%, hsla(225,39%,30%,0.2) 0, transparent 50%), 
            radial-gradient(at 100% 100%, hsla(253,16%,7%,1) 0, transparent 50%);
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          z-index: -1;
        }

        .blob {
          position: absolute;
          width: 800px;
          height: 800px;
          background: linear-gradient(180deg, rgba(79, 70, 229, 0.15) 0%, rgba(16, 185, 129, 0.1) 100%);
          filter: blur(120px);
          border-radius: 50%;
          z-index: -1;
          animation: move 30s infinite alternate ease-in-out;
        }

        @keyframes move {
          0% { transform: translate(-10%, -10%) scale(1) rotate(0deg); }
          50% { transform: translate(15%, 5%) scale(1.1) rotate(90deg); }
          100% { transform: translate(5%, 15%) scale(1) rotate(180deg); }
        }
    </style>

<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
    <script>
      function initObserver() {
        const observerOptions = { threshold: 0.1 };
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('active');
            }
          });
        }, observerOptions);

        document.querySelectorAll('.reveal, .stagger-container').forEach(el => observer.observe(el));
      }
      window.addEventListener('load', initObserver);
      // Fallback for dynamic content
      setInterval(() => {
        document.querySelectorAll('.reveal:not(.active), .stagger-container:not(.active)').forEach(el => {
          const rect = el.getBoundingClientRect();
          if (rect.top < window.innerHeight) el.classList.add('active');
        });
      }, 1000);
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
